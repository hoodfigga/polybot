name: Polybot CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-core-verification:
    name: Rust Workspace Test & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace Compilation
        run: cargo check --workspace --all-targets

      - name: Run Full Workspace Tests
        run: cargo test --workspace --all-targets

      - name: Run Clippy Quality Gate
        run: cargo clippy --workspace --all-targets -- -D warnings

  dashboard-build:
    name: Dashboard Client Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build Production Dashboard
        run: |
          cd dashboard
          npm run build
